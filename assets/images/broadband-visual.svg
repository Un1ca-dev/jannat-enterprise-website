<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="netCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="netShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Network grid background -->
  <rect width="540" height="420" rx="24" fill="url(#netCardBg)"/>
  <rect x="2" y="2" width="536" height="416" rx="22" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Glowing background circuit circles -->
  <circle cx="270" cy="210" r="140" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="270" cy="210" r="190" fill="none" stroke="#047857" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.3"/>

  <!-- Optical Fiber Core Line -->
  <path d="M50 210 H490" stroke="#38BDF8" stroke-width="3" stroke-dasharray="12 6" opacity="0.7"/>
  <path d="M270 50 V370" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>

  <!-- Central Gigabit Wi-Fi Router Hub -->
  <g transform="translate(195, 140)" filter="url(#netShadow)">
    <!-- Dual Antennas -->
    <path d="M30 40 L15 0" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 40 L135 0" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <!-- Antenna Tips -->
    <circle cx="15" cy="0" r="4.5" fill="#38BDF8"/>
    <circle cx="135" cy="0" r="4.5" fill="#38BDF8"/>
    
    <!-- Wi-Fi Radiation Waves from Antennas -->
    <path d="M5 -10 C15 -20, 25 -10, 25 -10" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M125 -10 C135 -20, 145 -10, 145 -10" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Router Body -->
    <rect y="35" width="150" height="75" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="10" y="45" width="130" height="24" rx="6" fill="#0F172A"/>
    
    <!-- Status LEDs -->
    <circle cx="28" cy="57" r="4" fill="#10B981"/>
    <circle cx="48" cy="57" r="4" fill="#10B981"/>
    <circle cx="68" cy="57" r="4" fill="#10B981"/>
    <circle cx="88" cy="57" r="4" fill="#38BDF8"/>
    <circle cx="108" cy="57" r="4" fill="#F97316"/>
    <circle cx="124" cy="57" r="3" fill="#10B981"/>

    <!-- Router Label -->
    <text x="75" y="93" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#E2E8F0" letter-spacing="1">
      FIBER OPTIC ROUTER
    </text>
  </g>

  <!-- Node 1: Home Wi-Fi (Top Left) -->
  <g transform="translate(45, 60)" filter="url(#netShadow)">
    <rect width="135" height="85" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="16" fill="url(#blueGlow)"/>
    <path d="M28 35 L34 26 L40 35 H28" fill="#FFFFFF"/>
    <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Home Wi-Fi</text>
    <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">All Room Range</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">Seamless Streaming</text>
  </g>

  <!-- Node 2: Office / Commercial Network (Top Right) -->
  <g transform="translate(360, 60)" filter="url(#netShadow)">
    <rect width="140" height="85" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="16" fill="url(#neonGreen)"/>
    <rect x="27" y="24" width="14" height="16" rx="2" fill="#FFFFFF"/>
    <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Office Internet</text>
    <text x="60" y="42" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#34D399">High Bandwidth</text>
    <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">Cyber Cafes &amp; Offices</text>
  </g>

  <!-- Node 3: Cable Network (Bottom Left) -->
  <g transform="translate(45, 275)" filter="url(#netShadow)">
    <rect width="140" height="90" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#F97316"/>
    <!-- TV icon -->
    <rect x="25" y="27" width="18" height="13" rx="2" fill="#FFFFFF"/>
    <line x1="31" y1="40" x2="37" y2="40" stroke="#FFFFFF" stroke-width="2"/>
    <text x="60" y="29" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Cable Network</text>
    <text x="60" y="44" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#FB923C">Clear Picture TV</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">Top Entertainment</text>
  </g>

  <!-- Node 4: Local Support & Repair (Bottom Right) -->
  <g transform="translate(355, 275)" filter="url(#netShadow)">
    <rect width="145" height="90" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#8B5CF6"/>
    <!-- Wrench icon -->
    <path d="M28 40 L37 31 C39 31, 41 29, 41 27 C41 24, 38 23, 36 24 L34 27 L31 26 L30 29 L33 31 Z" fill="#FFFFFF"/>
    <text x="60" y="29" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Local Support</text>
    <text x="60" y="44" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#A78BFA">Moktarpur • Domkal</text>
    <text x="14" y="72" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">Fast On-Site Care</text>
  </g>

  <!-- Speed Metric Floating Badge (Center Bottom) -->
  <g transform="translate(180, 270)" filter="url(#netShadow)">
    <rect width="180" height="46" rx="23" fill="#0A192F" stroke="#38BDF8" stroke-width="1.8"/>
    <circle cx="26" cy="23" r="10" fill="#10B981"/>
    <path d="M22 23 L25 26 L30 20" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="44" y="21" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">
      Optical Fiber Ready
    </text>
    <text x="44" y="34" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">
      Domkal Local Coverage
    </text>
  </g>
</svg>
