<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="270" cy="210" r="160" fill="#1E40AF" opacity="0.25" filter="url(#subtleGlow)"/>
  <circle cx="390" cy="110" r="80" fill="#38BDF8" opacity="0.2" filter="url(#subtleGlow)"/>
  <circle cx="110" cy="310" r="90" fill="#F97316" opacity="0.15" filter="url(#subtleGlow)"/>

  <!-- Connecting Network Circuit Lines -->
  <path d="M120 230 C180 180, 220 220, 270 190 S360 210, 420 160" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <path d="M150 340 C210 300, 260 320, 310 270 S390 280, 440 240" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Main Digital Terminal / Laptop Workspace -->
  <g transform="translate(100, 80)" filter="url(#cardShadow)">
    <!-- Base Plate -->
    <rect width="340" height="230" rx="20" fill="url(#heroCardBg)" stroke="#334155" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="340" height="38" rx="20" fill="#1E293B"/>
    <rect y="20" width="340" height="18" fill="#1E293B"/>
    <line x1="0" y1="38" x2="340" y2="38" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="24" cy="19" r="5" fill="#EF4444"/>
    <circle cx="40" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="19" r="5" fill="#10B981"/>
    
    <!-- Title in Window Bar -->
    <text x="170" y="24" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
      JANNAT ENTERPRISE • DIGITAL HUB
    </text>

    <!-- Content Area: Service Status Dashboard -->
    <rect x="20" y="52" width="140" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="40" cy="82" r="14" fill="#2563EB" opacity="0.2"/>
    <path d="M36 82 L39 85 L45 79" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <text x="62" y="76" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">CSC VLE ID</text>
    <text x="62" y="92" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#38BDF8">222365420014</text>

    <!-- Speed / Network Status -->
    <rect x="175" y="52" width="145" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="195" cy="82" r="14" fill="#10B981" opacity="0.2"/>
    <path d="M190 85 C190 80, 200 80, 200 85" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
    <circle cx="195" cy="86" r="1.5" fill="#10B981"/>
    <text x="217" y="76" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">Fiber Broadband</text>
    <text x="217" y="92" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#10B981">Ultra Fast Wi-Fi</text>

    <!-- Service Icons Bar -->
    <g transform="translate(20, 126)">
      <rect width="300" height="84" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Mini service pills -->
      <!-- 1. Ayushman BIS -->
      <g transform="translate(12, 14)">
        <rect width="60" height="56" rx="8" fill="#1E293B"/>
        <circle cx="30" cy="24" r="12" fill="#3B82F6" opacity="0.25"/>
        <path d="M26 24 L29 27 L35 21" fill="none" stroke="#60A5FA" stroke-width="2"/>
        <text x="30" y="47" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#CBD5E1">Ayushman</text>
      </g>
      <!-- 2. Bank BC -->
      <g transform="translate(82, 14)">
        <rect width="60" height="56" rx="8" fill="#1E293B"/>
        <circle cx="30" cy="24" r="12" fill="#10B981" opacity="0.25"/>
        <text x="30" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#34D399">₹</text>
        <text x="30" y="47" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#CBD5E1">Bank BC</text>
      </g>
      <!-- 3. PAN Service -->
      <g transform="translate(152, 14)">
        <rect width="60" height="56" rx="8" fill="#1E293B"/>
        <circle cx="30" cy="24" r="12" fill="#F97316" opacity="0.25"/>
        <rect x="23" y="18" width="14" height="11" rx="2" fill="none" stroke="#FB923C" stroke-width="1.8"/>
        <text x="30" y="47" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#CBD5E1">PAN Card</text>
      </g>
      <!-- 4. Bills & Forms -->
      <g transform="translate(222, 14)">
        <rect width="66" height="56" rx="8" fill="#1E293B"/>
        <circle cx="33" cy="24" r="12" fill="#8B5CF6" opacity="0.25"/>
        <path d="M28 20 H38 M28 24 H35 M28 28 H38" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round"/>
        <text x="33" y="47" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#CBD5E1">Bill / Forms</text>
      </g>
    </g>
  </g>

  <!-- Floating Badge 1: Ayushman BIS e-KYC (Top Left) -->
  <g transform="translate(30, 40)" filter="url(#cardShadow)">
    <rect width="180" height="66" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
    <circle cx="36" cy="33" r="18" fill="url(#accentGlow)"/>
    <path d="M30 33 L34 37 L43 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Ayushman PM-JAY</text>
    <text x="64" y="42" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">BIS e-KYC Assistance</text>
    <text x="64" y="55" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#94A3B8">Eligible Beneficiaries</text>
  </g>

  <!-- Floating Badge 2: High Speed Wi-Fi & Broadband (Bottom Right) -->
  <g transform="translate(330, 310)" filter="url(#cardShadow)">
    <rect width="185" height="74" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="38" cy="37" r="18" fill="url(#greenGlow)"/>
    <!-- Wi-Fi Waves -->
    <path d="M28 32 C33 27, 43 27, 48 32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M31 36 C34 33, 42 33, 45 36" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="38" cy="42" r="2.2" fill="#FFFFFF"/>
    <text x="68" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Optical Fiber Internet</text>
    <text x="68" y="44" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#34D399">Broadband &amp; Cable</text>
    <text x="68" y="58" font-family="-apple-system, sans-serif" font-size="8" font-weight="500" fill="#94A3B8">Home &amp; Commercial</text>
  </g>

  <!-- Floating Badge 3: Moktarpur Local Support (Bottom Left) -->
  <g transform="translate(45, 330)" filter="url(#cardShadow)">
    <rect width="175" height="60" rx="12" fill="#0F172A" stroke="#F97316" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="16" fill="url(#warmGlow)"/>
    <!-- Location Pin -->
    <path d="M32 20 C28 20, 25 23, 25 27 C25 32, 32 39, 32 39 C32 39, 39 32, 39 27 C39 23, 36 20, 32 20 Z" fill="#FFFFFF"/>
    <circle cx="32" cy="26" r="2.5" fill="#EA580C"/>
    <text x="56" y="26" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Moktarpur • Domkal</text>
    <text x="56" y="41" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#FDBA74">Local Customer Support</text>
    <text x="56" y="52" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="500" fill="#94A3B8">Mon - Sun: 9 AM - 8 PM</text>
  </g>
</svg>
