<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Subtle decorative grid & circuits -->
  <circle cx="1050" cy="150" r="300" fill="#1E40AF" opacity="0.2"/>
  <circle cx="150" cy="500" r="250" fill="#047857" opacity="0.15"/>
  <circle cx="950" cy="500" r="200" fill="#EA580C" opacity="0.15"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header Branding Row -->
  <g transform="translate(80, 80)">
    <!-- Monogram Box -->
    <rect width="80" height="80" rx="22" fill="#1D4ED8"/>
    <rect x="2" y="2" width="76" height="76" rx="20" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- J -->
    <path d="M33 22 V48 C33 55 27 57 22 56" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
    <!-- E -->
    <path d="M44 25 H60 M44 38 H56 M44 51 H60 M44 25 V51" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round"/>
    
    <text x="110" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      JANNAT <tspan fill="#38BDF8">ENTERPRISE</tspan>
    </text>
    <text x="110" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="2">
      DIGITAL SERVICE &amp; TECHNOLOGY CENTRE
    </text>

    <!-- CSC Badge -->
    <g transform="translate(720, 10)">
      <rect width="280" height="60" rx="30" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8"/>
      <circle cx="34" cy="30" r="14" fill="#2563EB"/>
      <path d="M28 30 L32 34 L40 25" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">CSC VLE ID</text>
      <text x="60" y="47" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#38BDF8">222365420014</text>
    </g>
  </g>

  <!-- Bengali Main Tagline -->
  <g transform="translate(80, 225)">
    <rect width="440" height="42" rx="10" fill="#1E3A8A" opacity="0.6"/>
    <text x="20" y="28" font-family="'Hind Siliguri', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FDBA74">
      "সব ডিজিটাল পরিষেবা, এক ছাদের নিচে"
    </text>
  </g>

  <!-- Large Headline -->
  <text x="80" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Your One-Stop Digital Service &amp; Technology Centre
  </text>

  <!-- Service Pills Row -->
  <g transform="translate(80, 365)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="30" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#38BDF8">✓ Ayushman PM-JAY</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="180" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="30" transform="translate(235, 0)" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399">✓ Bank BC Service</text>

    <!-- Pill 3 -->
    <rect x="430" y="0" width="190" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="30" transform="translate(430, 0)" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FDBA74">✓ PAN through CSC</text>

    <!-- Pill 4 -->
    <rect x="635" y="0" width="220" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="30" transform="translate(635, 0)" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#C084FC">✓ Broadband &amp; Cable</text>

    <!-- Pill 5 -->
    <rect x="870" y="0" width="170" height="48" rx="24" fill="#1E293B" stroke="#334155"/>
    <text x="24" y="30" transform="translate(870, 0)" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#F472B6">✓ Bill Payment</text>
  </g>

  <!-- Location & Contact Footer Strip -->
  <g transform="translate(80, 480)">
    <rect width="1040" height="80" rx="20" fill="#0F172A" stroke="#2563EB" stroke-width="1.8"/>
    
    <!-- Location -->
    <g transform="translate(30, 24)">
      <circle cx="16" cy="16" r="16" fill="#EA580C"/>
      <path d="M16 8 C12 8, 9 11, 9 15 C9 20, 16 26, 16 26 C16 26, 23 20, 23 15 C23 11, 20 8, 16 8 Z" fill="#FFFFFF"/>
      <text x="44" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">LOCATION</text>
      <text x="44" y="34" font-family="-apple-system, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Moktarpur, Raipur, Domkal, Murshidabad</text>
    </g>

    <!-- Phone -->
    <g transform="translate(730, 24)">
      <rect width="270" height="48" rx="24" fill="#10B981"/>
      <circle cx="28" cy="24" r="14" fill="#FFFFFF"/>
      <!-- phone handset -->
      <path d="M24 18 C24 18, 25 21, 27 21 C28 21, 29 20, 30 21 C31 22, 32 24, 30 25 C28 27, 25 26, 23 24 C21 22, 20 19, 22 17 C23 15, 24 16, 24 18 Z" fill="#059669"/>
      <text x="56" y="31" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">
        8918273721
      </text>
    </g>
  </g>
</svg>
